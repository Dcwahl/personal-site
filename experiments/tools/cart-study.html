<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Special delivery · Robot study</title>
  <link rel="stylesheet" href="../../styles.css?v=2">
  <style>
    .study-head, .controls { position: fixed; z-index: 5; left: 5vw; right: 5vw; }
    .study-head { top: 5vh; display: flex; justify-content: space-between; align-items: start; }
    .study-head p { margin: 0 0 .6rem; }
    .eyebrow { font: 10px monospace; letter-spacing: .15em; text-transform: uppercase; opacity: .6; }
    .title { font-size: clamp(22px, 3vw, 36px); letter-spacing: -.045em; }
    .study-head a { color: inherit; font-size: 12px; }
    .controls { bottom: 4vh; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
    button, select { color: inherit; font: inherit; background: transparent; border: 1px solid #17140f55; border-radius: 3px; padding: 9px 13px; }
    button { cursor: pointer; }
    button:hover { background: #17140f0d; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    input { width: 90px; accent-color: var(--ink); }
    #status { flex-basis: 100%; margin: 0; font-size: 12px; opacity: .65; }
    #deliver { background: var(--ink); color: var(--paper); min-width: 110px; }
    button:disabled { opacity: .4; cursor: default; }
    .room { transform-origin: 0 0; }
    [hidden] { display: none !important; }
    .viewing .study-head .title, .viewing .study-head .subtitle { visibility: hidden; }
    .viewing .controls { background: var(--paper); padding: 14px; border: 1px solid #17140f33; border-radius: 4px; }
    @media (max-width: 500px) { .controls { gap: 12px; } label { font-size: 11px; } select { padding: 8px; } }
  </style>
</head>
<body>
  <main>
    <h1>Robot cart experiment</h1>
    <div class="room" aria-hidden="true">
      <svg class="room__doorway"><defs><clipPath id="doorway-clip"><path data-door="clip" /></clipPath></defs><path class="doorway__beyond" data-door="hole" /><path class="doorway__panel" data-door="panel" clip-path="url(#doorway-clip)" /></svg>
      <img class="room__door" src="../../door.svg?v=2" alt="">
      <svg class="room__seams"><path data-seam="wallCorner" /><path data-seam="leftFloor" /><path data-seam="floorToDoor" /><path data-seam="floorPastDoor" /></svg>
    </div>
    <canvas class="stage stage--robot" aria-hidden="true"></canvas>
    <header class="study-head"><div><p class="eyebrow">Robot experiments / 01</p><p class="title">Special delivery.</p><p class="subtitle" style="font-size:12px;opacity:.6">A little robot. A rather big arcade.</p></div><a href="../../">back to room ↗</a></header>
    <div class="controls">
      <button id="deliver" type="button">games</button>
      <button id="pause" type="button" disabled>pause</button>
      <button id="approach" type="button" disabled aria-pressed="false">step closer</button>
      <label id="framing-control" hidden>Framing <input id="framing" type="range" min="0" max="1" step=".01" value=".85" aria-label="Camera framing: cabinet to screen"><output id="framing-name">bezel</output></label>
      <label>Motion <select id="mode"><option value="push">Push</option><option value="pull">Pull backwards</option></select></label>
      <label>Load <input id="load" type="range" min="0" max="1" step=".1" value=".8"><output id="weight">hefty</output></label>
      <p id="status" role="status">Press games. He’ll bring it over.</p>
    </div>
  </main>
  <script type="module" src="cart-study.js"></script>
</body>
</html>
