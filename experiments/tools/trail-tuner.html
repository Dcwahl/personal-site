<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trail tuner</title>
    <style>
      :root { --paper: #dac9a4; --ink: #17140f; }
      body {
        margin: 0; background: var(--paper); color: var(--ink);
        font: 13px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      canvas { display: block; width: 100%; height: 62vh; }
      .panel {
        position: fixed; inset: auto auto 0 0; width: 100%;
        display: flex; flex-wrap: wrap; gap: 1.5rem;
        padding: 1rem 1.5rem; background: rgb(23 20 15 / 6%);
        backdrop-filter: blur(4px);
      }
      label { display: flex; flex-direction: column; gap: 0.25rem; min-width: 11rem; }
      .row { display: flex; align-items: center; gap: 0.5rem; }
      output { font-variant-numeric: tabular-nums; min-width: 2.5rem; }
      code {
        display: block; width: 100%; padding: 0.6rem 0.8rem;
        font-family: ui-monospace, Menlo, monospace; font-size: 12px;
        background: rgb(23 20 15 / 8%); border-radius: 3px; white-space: pre;
      }
      .presets { display: flex; gap: 0.5rem; align-items: flex-end; }
      button {
        font: inherit; padding: 0.35rem 0.7rem; cursor: pointer;
        color: inherit; background: transparent;
        border: 1px solid rgb(23 20 15 / 35%); border-radius: 3px;
      }
      button:hover { background: rgb(23 20 15 / 8%); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="panel">
      <label>mark length <span class="row"><input id="length" type="range" min="0" max="20" step="0.5" /><output id="lengthOut"></output></span></label>
      <label>mark width <span class="row"><input id="width" type="range" min="0.4" max="4" step="0.02" /><output id="widthOut"></output></span></label>
      <label>spacing <span class="row"><input id="spacing" type="range" min="2" max="30" step="0.5" /><output id="spacingOut"></output></span></label>
      <label>opacity <span class="row"><input id="opacity" type="range" min="0.1" max="1" step="0.02" /><output id="opacityOut"></output></span></label>
      <div class="presets">
        <button data-preset="0,1.24,6.5">dots</button>
        <button data-preset="3,1,7">short dash</button>
        <button data-preset="7,1,12">long dash</button>
        <button data-preset="14,0.8,20">stitch</button>
      </div>
      <code id="out"></code>
    </div>

    <script type="module">
      import { trailStyle, buildTrailDots, drawTrail } from "../../trail.js?v=5";

      const canvas = document.getElementById("stage");
      const context = canvas.getContext("2d");
      let dots = [];
      let width = 0;
      let height = 0;

      // A stand-in for the real flight path: same shape of gentle rise plus a
      // long oscillation, so mark spacing reads the way it will in situ.
      const path = (progress) => ({
        x: -80 + progress * (width + 160),
        y:
          height * 0.58 -
          progress * height * 0.22 +
          Math.sin(progress * Math.PI * 2 * 1.15 - Math.PI / 2) *
            Math.min(60, height * 0.11),
      });

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth;
        height = canvas.clientHeight;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        dots = buildTrailDots(path);
        render();
      }

      function render() {
        context.clearRect(0, 0, width, height);
        // Full path, fully opaque, so the mark shape is what you are judging.
        drawTrail(context, dots, {
          progress: 1,
          flightDuration: 10_800,
          trailLifetime: Number.POSITIVE_INFINITY,
        });

        const { length, width: w, spacing, opacity } = trailStyle;
        document.getElementById("out").textContent =
          `spacing: ${spacing},  length: ${length},  width: ${w},  opacity: ${opacity}`;
      }

      const controls = ["length", "width", "spacing", "opacity"];

      function sync() {
        for (const key of controls) {
          document.getElementById(key).value = trailStyle[key];
          document.getElementById(`${key}Out`).textContent = trailStyle[key];
        }
      }

      for (const key of controls) {
        document.getElementById(key).addEventListener("input", (event) => {
          trailStyle[key] = Number(event.target.value);
          document.getElementById(`${key}Out`).textContent = trailStyle[key];
          if (key === "spacing") dots = buildTrailDots(path);
          render();
        });
      }

      for (const button of document.querySelectorAll("[data-preset]")) {
        button.addEventListener("click", () => {
          const [length, w, spacing] = button.dataset.preset
            .split(",")
            .map(Number);
          Object.assign(trailStyle, { length, width: w, spacing });
          dots = buildTrailDots(path);
          sync();
          render();
        });
      }

      window.addEventListener("resize", resize);
      sync();
      resize();
    </script>
  </body>
</html>
